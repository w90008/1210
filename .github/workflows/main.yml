
name: Build AnyPad PS5

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "web/**"
      - "assets/**"
      - "maps/**"
      - "tests/**"
      - "tools/**"
      - "Makefile"
      - "ps5.mk"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make unzip wget xxd

      - name: Download PS5 SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q ps5-payload-sdk.zip -d /opt

      - name: Build PS5 ELF
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make ps5 PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK"
          test -n "$(find dist -maxdepth 1 -name 'AnyPad-PS5-*.elf' -print -quit)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AnyPad-PS5-ELF
          path: dist/AnyPad-PS5-*.elf
          if-no-files-found: error
          retention-days: 30
